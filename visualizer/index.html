<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warranted</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ════════ Phase 1: Full-screen Dashboard ════════ -->
<div id="phase-1">
  <div id="phase1-bg" aria-hidden="true"></div>
  <div id="phase1-inner">
    <div id="phase1-label">Warranted · Proposition Graph</div>

    <div id="phase1-hero">
      <div id="phase1-total-num" class="phase1-big-num">0</div>
      <div id="phase1-total-label">PROPOSITIONS</div>
    </div>

    <div id="phase1-stats">
      <div class="phase1-stat">
        <div class="phase1-stat-num" id="phase1-settled">0</div>
        <div class="phase1-stat-label">正向档<br>SETTLED</div>
      </div>
      <div class="phase1-stat-divider"></div>
      <div class="phase1-stat">
        <div class="phase1-stat-num" id="phase1-open">0</div>
        <div class="phase1-stat-label">未成立<br>UNESTABLISHED</div>
      </div>
      <div class="phase1-stat-divider"></div>
      <div class="phase1-stat">
        <div class="phase1-stat-num" id="phase1-flagged">0</div>
        <div class="phase1-stat-label">待看一眼<br>FLAGGED</div>
      </div>
    </div>

    <div id="phase1-meta">
      <span id="live-dot"></span>
      <span id="live-text">连接中…</span>
      <span class="phase1-sep">·</span>
      <span id="db-current-path" class="phase1-db">加载中…</span>
    </div>

    <div id="phase1-attention"></div>

    <button id="phase1-enter">
      <span class="phase1-enter-arrow">↑</span>
      查看图谱
    </button>
  </div>
</div>

<!-- ════════ Phase 2: Graph view ════════ -->
<div id="phase-2">

  <!-- ── Floating Command Window ── -->
  <div id="command-window">
    <div id="cw-rest">
      <div id="cw-filters">
        <button class="band-toggle active band-certainly"     data-qualifier="certainly"     title="certainly">●</button>
        <button class="band-toggle active band-probably"      data-qualifier="probably"      title="probably">◐</button>
        <button class="band-toggle active band-possibly"      data-qualifier="possibly"      title="possibly">○</button>
        <button class="band-toggle active band-unestablished" data-qualifier="unestablished" title="unestablished">·</button>
        <button class="band-toggle active band-refuted"       data-qualifier="refuted"       title="refuted">✕</button>
      </div>
      <div id="cw-search-hint">
        <span class="cw-search-icon">⌕</span>
        <span class="cw-hint-text">Search propositions…</span>
        <span class="cw-kbd">⌘K</span>
      </div>
    </div>

    <div id="cw-expanded">
      <div id="cw-search-row">
        <span class="cw-search-icon-big">⌕</span>
        <input id="cw-search-input" type="text" placeholder="Search nodes…" autocomplete="off">
        <button id="cw-close-btn">Esc</button>
      </div>

      <div id="cw-sections">
        <div class="cw-section">
          <div class="cw-section-label">按档位过滤</div>
          <div class="cw-filter-pills">
            <label class="cw-pill active band-certainly" data-qualifier="certainly">
              <span class="cw-pill-icon">●</span>
              <span class="cw-pill-name">Certainly</span>
              <span class="cw-pill-count" id="count-certainly">0</span>
            </label>
            <label class="cw-pill active band-probably" data-qualifier="probably">
              <span class="cw-pill-icon">◐</span>
              <span class="cw-pill-name">Probably</span>
              <span class="cw-pill-count" id="count-probably">0</span>
            </label>
            <label class="cw-pill active band-possibly" data-qualifier="possibly">
              <span class="cw-pill-icon">○</span>
              <span class="cw-pill-name">Possibly</span>
              <span class="cw-pill-count" id="count-possibly">0</span>
            </label>
            <label class="cw-pill active band-unestablished" data-qualifier="unestablished">
              <span class="cw-pill-icon">·</span>
              <span class="cw-pill-name">Unestablished</span>
              <span class="cw-pill-count" id="count-unestablished">0</span>
            </label>
            <label class="cw-pill active band-refuted" data-qualifier="refuted">
              <span class="cw-pill-icon">✕</span>
              <span class="cw-pill-name">Refuted</span>
              <span class="cw-pill-count" id="count-refuted">0</span>
            </label>
          </div>
        </div>

        <div class="cw-section">
          <div class="cw-section-label">图的状态</div>
          <div class="cw-progress-item">
            <div class="cw-progress-header">
              <span>已判定（正向三档）</span>
              <span id="settled-progress-label" class="cw-progress-count">0/0</span>
            </div>
            <div class="cw-progress-track">
              <div class="cw-progress-fill" id="settled-progress-bar" style="width:0%"></div>
            </div>
          </div>
          <div class="cw-progress-item">
            <div class="cw-progress-header">
              <span>待看一眼</span>
              <span id="attention-progress-label" class="cw-progress-count">0/0</span>
            </div>
            <div class="cw-progress-track">
              <div class="cw-progress-fill cw-progress-fill-warn" id="attention-progress-bar" style="width:0%"></div>
            </div>
          </div>
        </div>

        <div class="cw-section">
          <div class="cw-section-label">数据库</div>
          <div class="cw-db">
            <div class="cw-db-path">当前：<span id="db-current-path-2" class="cw-db-val">—</span></div>
            <div class="cw-db-row">
              <input type="text" id="db-path-input" placeholder="输入 .toulmin 目录绝对路径">
              <button id="db-switch-btn">切换</button>
            </div>
            <div id="db-status" class="db-status"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Full-bleed Canvas ── -->
  <div id="graph-container">
    <div id="toolbar">
      <button onclick="refreshGraph()">⟳</button>
      <button onclick="fitGraph()">◎</button>
      <button onclick="centerGraph()">⊕</button>
      <button id="toolbar-back" onclick="returnToPhase1()" title="返回大盘">↓</button>
      <div class="toolbar-sep"></div>
      <button id="mode-box" class="mode-btn active" onclick="setSelectionMode('box')" title="框选模式 (拖动画框选中节点)">⬚</button>
      <button id="mode-pan" class="mode-btn" onclick="setSelectionMode('pan')" title="拖动模式 (拖动平移画布)">✥</button>
    </div>
    <div id="graph"></div>
    <div id="empty-state" style="display:none">
      <p style="font-size:40px;margin-bottom:12px;opacity:0.3">◈</p>
      <p>暂无命题</p>
      <p style="font-size:12px;margin-top:6px">使用 MCP 工具创建命题后刷新</p>
    </div>
  </div>

  <!-- ── Bottom Sheet ── -->
  <div id="bottom-sheet">
    <div id="bs-handle"></div>
    <div id="bs-content"></div>
  </div>

  <!-- ── Status Bar ── -->
  <div id="statusbar">
    <div id="sb-left">
      <span id="sb-live-dot" class="sb-dot"></span>
      <span id="sb-live-text">—</span>
      <span class="sb-sep">·</span>
      <span id="stat-total">0</span> propositions
    </div>
    <div id="sb-right">
      <span id="selection-count" style="display:none; color:#4FDFFF; font-size:11px; font-weight:600; letter-spacing:0.04em;"></span>
    </div>
  </div>
</div>

<!-- ════════ Hidden control panel (DOM constraint: data.js / app.js query these) ════════ -->
<div id="filter-panel" aria-hidden="true">
  <input type="checkbox" data-qualifier="certainly" checked>
  <input type="checkbox" data-qualifier="probably" checked>
  <input type="checkbox" data-qualifier="possibly" checked>
  <input type="checkbox" data-qualifier="unestablished" checked>
  <input type="checkbox" data-qualifier="refuted" checked>
  <input type="radio" name="layout" value="tree" checked>
  <input type="radio" name="layout" value="force">
  <input type="text" id="search-input">
</div>

<!-- ════════ Floating Tooltip ════════ -->
<div id="tooltip">
  <div class="tt-type" id="tt-type"></div>
  <div class="tt-content" id="tt-content"></div>
  <div class="tt-meta" id="tt-meta"></div>
</div>

<!-- ════════ Scripts (load order matters) ════════ -->
<script src="js/bg.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/tooltip.js"></script>
<script src="js/graph-init.js"></script>
<script src="js/forest.js"></script>
<script src="js/renderer.js"></script>
<script src="js/data.js"></script>
<script src="js/selection.js"></script>
<script src="js/bottomsheet.js"></script>
<script src="js/detail.js"></script>
<script src="js/db.js"></script>
<script src="js/phase.js"></script>
<script src="js/app.js"></script>

</body>
</html>
